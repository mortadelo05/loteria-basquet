name: club_basket_loteria
description: "Gestión de Lotería - Club de Bàsquet (Excel, Regla 5€/20€, Firebase Firestore)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core y Servicios
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.4
  firebase_app_check: ^0.3.2+2

  # Importación de Excel y selección de archivos
  file_picker: ^8.1.7
  excel: ^4.0.6

  # Utilidades
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
