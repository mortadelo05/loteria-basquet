name: Compilar APK Android - Club Bàsquet

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter SDK Estable (3.27.4)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.4'
          cache: true

      - name: Preparar y configurar proyecto Android
        run: |
          echo "=== 1. Verificando estructura del proyecto ==="
          if [ -f "main.dart" ] && [ ! -f "lib/main.dart" ]; then
            mkdir -p lib
            mv main.dart lib/main.dart
            echo "Movido main.dart a lib/main.dart"
          fi

          # Regenerar una estructura Android limpia y oficial
          rm -rf /tmp/clean_flutter
          mkdir -p /tmp/clean_flutter
          cd /tmp/clean_flutter
          flutter create basket_app --platforms=android --org com.clubbasket.loteria
          cd $GITHUB_WORKSPACE
          rm -rf android
          cp -r /tmp/clean_flutter/basket_app/android ./android
          echo "Carpeta android limpia y oficial generada."

          # Forzar minSdk = 23 en la configuracion de Android
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/g' android/app/build.gradle.kts
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
          fi

          # Configurar memoria y compatibilidad en gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" > android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Descargar dependencias
        run: |
          flutter clean
          flutter pub get

      - name: Compilar APK Android
        run: |
          echo "=== Intentando compilar APK Release ==="
          if flutter build apk --release --no-tree-shake-icons; then
            echo "✅ Compilación Release completada con éxito."
          else
            echo "⚠️ Release encontró restricciones de R8/firmas. Compilando APK Debug garantizado..."
            flutter build apk --debug --no-tree-shake-icons
            echo "✅ Compilación Debug completada con éxito."
          fi

      - name: Subir APK como artefacto de descarga directa
        uses: actions/upload-artifact@v4
        with:
          name: Loteria-Club-Basquet-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
