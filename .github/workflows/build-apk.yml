name: Compilar APK Android - Club Bàsquet

on:
  workflow_dispatch:
  push:

permissions: write-all

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter SDK Estable (3.27.4)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.4'
          cache: true

      - name: Preparar y configurar proyecto Android
        run: |
          echo "=== 1. Asegurar estructura del proyecto ==="
          if [ -f "main.dart" ] && [ ! -f "lib/main.dart" ]; then
            mkdir -p lib
            mv main.dart lib/main.dart
            echo "Movido main.dart a lib/main.dart"
          fi

          # Regenerar una estructura Android limpia y oficial
          rm -rf /tmp/clean_flutter
          mkdir -p /tmp/clean_flutter
          cd /tmp/clean_flutter
          flutter create basket_app --platforms=android --org com.clubbasket.loteria
          cd $GITHUB_WORKSPACE
          rm -rf android
          cp -r /tmp/clean_flutter/basket_app/android ./android
          echo "Carpeta android limpia y oficial generada."

          # 1. Forzar propiedades de SDK moderno (Android 14 API 34, minSdk 24) en local.properties
          echo "flutter.minSdkVersion=24" > android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties

          # 2. Configurar memoria y compatibilidad en gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" > android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          # 3. Configuración definitiva de compileSdk 34, targetSdk 34, minSdk 24 y firma Release
          python3 -c "import textwrap, sys; exec(textwrap.dedent(sys.stdin.read()))" << 'PYEOF'
          import os, re

          # Actualizar AndroidManifest.xml
          manifest = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest):
              with open(manifest, "r", encoding="utf-8") as f:
                  m = f.read()
              if 'xmlns:tools' not in m:
                  m = m.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ')
              
              # Reemplazar o insertar uses-sdk con targetSdkVersion 34 explícito
              sdk_tag = '    <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" tools:overrideLibrary="com.google.firebase.auth, io.flutter.plugins.firebase.auth, com.google.firebase, io.flutter.plugins.firebase.core, io.flutter.plugins.firebase.firestore" />'
              if '<uses-sdk' in m:
                  m = re.sub(r'<uses-sdk[^>]*/>', sdk_tag, m)
              else:
                  m = m.replace('<application', sdk_tag + '
    <application', 1)
              
              # Asegurar permisos de red y almacenamiento
              for perm in ['android.permission.INTERNET', 'android.permission.READ_EXTERNAL_STORAGE', 'android.permission.WRITE_EXTERNAL_STORAGE']:
                  if perm not in m:
                      m = m.replace('<application', f'    <uses-permission android:name="{perm}" />
    <application', 1)
              
              with open(manifest, "w", encoding="utf-8") as f:
                  f.write(m)
              print("✅ AndroidManifest.xml configurado con targetSdkVersion 34 y minSdkVersion 24.")

          # Forzar compileSdk 34, targetSdk 34, minSdk 24 y firma debug en release
          for path in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(path):
                  with open(path, "r", encoding="utf-8") as f:
                      g = f.read()
                  if path.endswith(".kts"):
                      g = re.sub(r'compileSdks*=.*', 'compileSdk = 34', g)
                      g = re.sub(r'minSdks*=.*', 'minSdk = 24', g)
                      g = re.sub(r'targetSdks*=.*', 'targetSdk = 34', g)
                      if 'targetSdk' not in g:
                          g = g.replace('minSdk = 24', 'minSdk = 24
        targetSdk = 34')
                      if 'signingConfigs.getByName("debug")' not in g:
                          g = re.sub(r'releases*{', 'release {
            signingConfig = signingConfigs.getByName("debug")', g)
                  else:
                      g = re.sub(r'compileSdkVersions+.*', 'compileSdkVersion 34', g)
                      g = re.sub(r'compileSdks*=.*', 'compileSdk = 34', g)
                      g = re.sub(r'minSdkVersions+.*', 'minSdkVersion 24', g)
                      g = re.sub(r'minSdks*=.*', 'minSdk = 24', g)
                      g = re.sub(r'targetSdkVersions+.*', 'targetSdkVersion 34', g)
                      g = re.sub(r'targetSdks*=.*', 'targetSdk = 34', g)
                      if 'targetSdkVersion' not in g and 'targetSdk' not in g:
                          g = g.replace('minSdkVersion 24', 'minSdkVersion 24
        targetSdkVersion 34')
                      if 'signingConfigs.debug' not in g:
                          g = re.sub(r'releases*{', 'release {
            signingConfig signingConfigs.debug', g)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(g)
                  print(f"✅ {path} actualizado a compileSdk 34, minSdk 24, targetSdk 34.")
          PYEOF

      - name: Descargar dependencias
        run: |
          flutter clean
          flutter pub get
          # Reasegurar configuración en local.properties tras pub get
          echo "flutter.minSdkVersion=24" > android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          python3 -c "import textwrap, sys; exec(textwrap.dedent(sys.stdin.read()))" << 'PYEOF'
          import os, re
          for path in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(path):
                  with open(path, "r", encoding="utf-8") as f:
                      g = f.read()
                  if path.endswith(".kts"):
                      g = re.sub(r'compileSdks*=.*', 'compileSdk = 34', g)
                      g = re.sub(r'minSdks*=.*', 'minSdk = 24', g)
                      g = re.sub(r'targetSdks*=.*', 'targetSdk = 34', g)
                  else:
                      g = re.sub(r'compileSdkVersions+.*', 'compileSdkVersion 34', g)
                      g = re.sub(r'compileSdks*=.*', 'compileSdk = 34', g)
                      g = re.sub(r'minSdkVersions+.*', 'minSdkVersion 24', g)
                      g = re.sub(r'minSdks*=.*', 'minSdk = 24', g)
                      g = re.sub(r'targetSdkVersions+.*', 'targetSdkVersion 34', g)
                      g = re.sub(r'targetSdks*=.*', 'targetSdk = 34', g)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(g)
          PYEOF

      - name: Validar sintaxis y tipos Dart
        run: |
          echo "=== Verificando integridad de código Dart ==="
          flutter analyze --no-fatal-infos

      - name: Compilar APK Android
        run: |
          echo "=== Intentando compilar APK Release (Android 14 - API 34) ==="
          if flutter build apk --release --no-tree-shake-icons; then
            echo "✅ Compilación Release completada con éxito."
          else
            echo "⚠️ Release encontró restricciones de firma o R8. Compilando APK Debug garantizado..."
            flutter build apk --debug --no-tree-shake-icons
            echo "✅ Compilación Debug completada con éxito."
          fi

      - name: Subir APK como artefacto de descarga directa
        uses: actions/upload-artifact@v4
        with:
          name: Loteria-Club-Basquet-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
