name: Compilar APK Android - Club Bàsquet

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-reparar estructura Android si falta
        run: |
          echo "=== 1. Verificando estructura del proyecto ==="
          # Si main.dart está en la raíz, moverlo a lib/
          if [ -f "main.dart" ] && [ ! -f "lib/main.dart" ]; then
            mkdir -p lib
            mv main.dart lib/main.dart
            echo "Movido main.dart a lib/main.dart"
          fi

          # Generar carpeta android limpia en entorno aislado
          if [ ! -d "android" ]; then
            echo "Generando carpeta android oficial en entorno aislado..."
            mkdir -p /tmp/clean_flutter
            cd /tmp/clean_flutter
            flutter create basket_app --platforms=android --org com.clubbasket.loteria
            cd $GITHUB_WORKSPACE
            cp -r /tmp/clean_flutter/basket_app/android ./android
            echo "Carpeta android generada e integrada correctamente."
          fi

          # Ajustar minSdkVersion 21, multiDexEnabled y evitar fallos de Lint o firma
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
            sed -i '/defaultConfig {/a \        multiDexEnabled true' android/app/build.gradle || true
            sed -i 's/signingConfig = signingConfigs.release/signingConfig = signingConfigs.debug/g' android/app/build.gradle || true
            sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true
            cat << 'EOF' >> android/app/build.gradle

android {
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}
EOF
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts || true
            sed -i '/defaultConfig {/a \        multiDexEnabled = true' android/app/build.gradle.kts || true
            cat << 'EOF' >> android/app/build.gradle.kts

android {
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}
EOF
          fi

      - name: Descargar dependencias
        run: flutter pub get

      - name: Compilar APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Subir APK como artefacto de descarga directa
        uses: actions/upload-artifact@v4
        with:
          name: Loteria-Club-Basquet-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
