name: Compilar APK Android - Club Bàsquet

on:
  workflow_dispatch:
  push:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter SDK Estable (3.27.4)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.4'
          cache: true

      - name: Preparar estructura Android y descargar dependencias
        run: |
          echo "=== 1. Asegurar estructura del proyecto ==="
          if [ -f "main.dart" ] && [ ! -f "lib/main.dart" ]; then
            mkdir -p lib
            mv main.dart lib/main.dart
            echo "Movido main.dart a lib/main.dart"
          fi

          if [ ! -f "lib/main.dart" ]; then
            echo "ERROR: No se encuentra lib/main.dart ni main.dart en el repositorio."
            exit 1
          fi

          if [ ! -f "pubspec.yaml" ]; then
            echo "Generando pubspec.yaml oficial automáticamente..."
            cat << 'PUBEOF' > pubspec.yaml
          name: club_basket_loteria
          description: "Gestión de Lotería - Club de Bàsquet"
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.2.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            firebase_core: ^3.12.0
            cloud_firestore: ^5.6.4
            file_picker: ^8.1.7
            excel: ^4.0.6
            cupertino_icons: ^1.0.8
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0
          dependency_overrides:
            archive: ^3.6.1
          flutter:
            uses-material-design: true
          PUBEOF
          fi

          # Regenerar una estructura Android limpia y oficial
          rm -rf /tmp/clean_flutter
          mkdir -p /tmp/clean_flutter
          cd /tmp/clean_flutter
          flutter create basket_app --platforms=android --org com.clubbasket.loteria
          cd "$GITHUB_WORKSPACE"
          rm -rf android
          cp -r /tmp/clean_flutter/basket_app/android ./android
          echo "Carpeta android limpia y oficial generada."

          # Descargar paquetes para inicializar local.properties con las rutas del SDK
          flutter pub get

      - name: Configurar Android 14 (API 34), minSdk 24 y permisos
        run: |
          python3 - << 'PYEOF'
          import os

          NL = chr(10)

          # 1. Actualizar android/local.properties manteniendo sdk.dir y flutter.sdk
          local_props = "android/local.properties"
          kept_lines = []
          if os.path.exists(local_props):
              with open(local_props, "r", encoding="utf-8") as f:
                  for line in f:
                      if not line.startswith(("flutter.minSdkVersion=", "flutter.targetSdkVersion=", "flutter.compileSdkVersion=")):
                          kept_lines.append(line.rstrip(NL))
          kept_lines.extend([
              "flutter.minSdkVersion=24",
              "flutter.targetSdkVersion=34",
              "flutter.compileSdkVersion=34",
          ])
          with open(local_props, "w", encoding="utf-8") as f:
              f.write(NL.join(kept_lines) + NL)
          print("local.properties actualizado.")

          # 2. Configurar gradle.properties
          gradle_props = "android/gradle.properties"
          g_lines = [
              "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m",
              "android.useAndroidX=true",
              "android.enableJetifier=true",
          ]
          with open(gradle_props, "w", encoding="utf-8") as f:
              f.write(NL.join(g_lines) + NL)
          print("gradle.properties actualizado.")

          # 3. Configurar AndroidManifest.xml
          manifest = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest):
              with open(manifest, "r", encoding="utf-8") as f:
                  m = f.read()
              if "xmlns:tools" not in m:
                  m = m.replace("<manifest ", '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
              while "<uses-sdk" in m:
                  s_idx = m.index("<uses-sdk")
                  e_idx = m.index("/>", s_idx) + 2
                  m = m[:s_idx] + m[e_idx:]
              anchor = "    <application" if "    <application" in m else "<application"
              sdk_tag = '    <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" tools:overrideLibrary="com.google.firebase.auth, io.flutter.plugins.firebase.auth, com.google.firebase, io.flutter.plugins.firebase.core, io.flutter.plugins.firebase.firestore" />'
              m = m.replace(anchor, sdk_tag + NL + anchor, 1)
              for perm in [
                  "android.permission.INTERNET",
                  "android.permission.READ_EXTERNAL_STORAGE",
                  "android.permission.WRITE_EXTERNAL_STORAGE",
              ]:
                  if perm not in m:
                      m = m.replace(anchor, '    <uses-permission android:name="' + perm + '" />' + NL + anchor, 1)
              m = m.replace('android:label="basket_app"', 'android:label="Lotería Club Bàsquet"')
              with open(manifest, "w", encoding="utf-8") as f:
                  f.write(m)
              print("AndroidManifest.xml configurado con targetSdkVersion 34 y minSdkVersion 24.")

          # 4. Configurar build.gradle y build.gradle.kts
          for path in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(path):
                  with open(path, "r", encoding="utf-8") as f:
                      lines = f.readlines()
                  is_kts = path.endswith(".kts")
                  out = []
                  for line in lines:
                      st = line.strip()
                      ind = line[:len(line) - len(line.lstrip())]
                      if st.startswith("compileSdkVersion"):
                          out.append(ind + ("compileSdk = 34" if is_kts else "compileSdk 34") + NL)
                      elif st.startswith("compileSdk ") or st.startswith("compileSdk="):
                          out.append(ind + "compileSdk = 34" + NL)
                      elif st.startswith("minSdkVersion"):
                          out.append(ind + ("minSdk = 24" if is_kts else "minSdkVersion 24") + NL)
                      elif st.startswith("minSdk ") or st.startswith("minSdk="):
                          out.append(ind + "minSdk = 24" + NL)
                      elif st.startswith("targetSdkVersion"):
                          out.append(ind + ("targetSdk = 34" if is_kts else "targetSdkVersion 34") + NL)
                      elif st.startswith("targetSdk ") or st.startswith("targetSdk="):
                          out.append(ind + "targetSdk = 34" + NL)
                      else:
                          out.append(line)
                  g = "".join(out)
                  if "targetSdk" not in g:
                      if "minSdk = 24" in g:
                          g = g.replace("minSdk = 24", "minSdk = 24" + NL + "        targetSdk = 34", 1)
                      elif "minSdkVersion 24" in g:
                          g = g.replace("minSdkVersion 24", "minSdkVersion 24" + NL + "        targetSdkVersion 34", 1)
                  if "signingConfig" not in g:
                      if is_kts:
                          g = g.replace("release {", 'release {' + NL + '            signingConfig = signingConfigs.getByName("debug")', 1)
                      else:
                          g = g.replace("release {", 'release {' + NL + '            signingConfig signingConfigs.debug', 1)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(g)
                  print("Gradle actualizado:", path)
          PYEOF

      - name: Validar sintaxis y tipos Dart
        run: |
          echo "=== Verificando integridad de código Dart ==="
          flutter analyze --no-fatal-infos

      - name: Compilar APK Android
        run: |
          echo "=== Intentando compilar APK Release (Android 14 - API 34) ==="
          if flutter build apk --release --no-tree-shake-icons; then
            echo "Compilación Release completada con éxito."
          else
            echo "Release encontró restricciones de firma o R8. Compilando APK Debug garantizado..."
            flutter build apk --debug --no-tree-shake-icons
            echo "Compilación Debug completada con éxito."
          fi

      - name: Subir APK como artefacto de descarga directa
        uses: actions/upload-artifact@v4
        with:
          name: Loteria-Club-Basquet-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
