name: Compilar APK Android - Club Bàsquet

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter SDK Estable (3.27.4)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.4'
          cache: true

      - name: Auto-reparar estructura Android si falta
        run: |
          echo "=== 1. Verificando estructura del proyecto ==="
          if [ -f "main.dart" ] && [ ! -f "lib/main.dart" ]; then
            mkdir -p lib
            mv main.dart lib/main.dart
            echo "Movido main.dart a lib/main.dart"
          fi

          if [ ! -d "android" ]; then
            echo "Generando carpeta android oficial..."
            mkdir -p /tmp/clean_flutter
            cd /tmp/clean_flutter
            flutter create basket_app --platforms=android --org com.clubbasket.loteria
            cd $GITHUB_WORKSPACE
            cp -r /tmp/clean_flutter/basket_app/android ./android
            echo "Carpeta android generada e integrada correctamente."
          fi

          # Asignar 4GB de memoria para evitar que el compilador se quede sin RAM
          mkdir -p android
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

          # Configurar minSdkVersion 21 y modo release directo
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
            sed -i 's/signingConfig = signingConfigs.release/signingConfig = signingConfigs.debug/g' android/app/build.gradle || true
            echo "android.defaultConfig.multiDexEnabled = true" >> android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts || true
            echo "android.defaultConfig.multiDexEnabled = true" >> android/app/build.gradle.kts
          fi

      - name: Limpiar y descargar dependencias
        run: |
          flutter clean
          flutter pub get

      - name: Diagnóstico previo de código Dart
        run: flutter analyze --no-fatal-infos || true

      - name: Compilar APK Release
        run: flutter build apk --release --no-tree-shake-icons --verbose

      - name: Subir APK como artefacto de descarga directa
        uses: actions/upload-artifact@v4
        with:
          name: Loteria-Club-Basquet-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
